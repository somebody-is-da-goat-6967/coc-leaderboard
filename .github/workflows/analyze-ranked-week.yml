name: analyze-ranked-week

# Decodes the crawl-ranked-week shards into small stats files (ranks, armies, openers) on the ranked-data branch,
# so the Discord bot downloads one tiny player file instead of whole town hall shards.
on:
  workflow_run:
    workflows: ["crawl-ranked-week"]   # must match the `name:` of your crawler workflow
    types: [completed]
  schedule:
    - cron: "37 */4 * * *"             # safety net if a crawl run was skipped
  workflow_dispatch:
    inputs:
      week:
        description: "Week to (re)build, YYYY-MM-DD. Blank = current + previous week"
        required: false
        default: ""
      force:
        description: "Rebuild even if the shards haven't changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: analyze-ranked-week
  cancel-in-progress: false

jobs:
  analyze:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout ranked-data branch
        uses: actions/checkout@v4
        with:
          ref: ranked-data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Older finished weeks live on their own ranked-archive-<date> branch; fetch it when one is requested by hand.
      - name: Fetch archive branch for a requested week
        if: github.event_name == 'workflow_dispatch' && inputs.week != ''
        env:
          WEEK: ${{ inputs.week }}
        run: |
          if [ ! -d "data/ranked/$WEEK/shards" ]; then
            git -C data fetch --depth 1 origin "ranked-archive-$WEEK" \
              && git -C data worktree add "$GITHUB_WORKSPACE/archive" FETCH_HEAD \
              || echo "no archive branch for $WEEK"
          fi

      - name: Analyze
        env:
          WEEK: ${{ inputs.week }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS="--data data --src src --week ${WEEK:-auto}"
          [ -d archive ] && ARGS="$ARGS --archive archive"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          node --max-old-space-size=4096 src/scanner/analyze-ranked.js $ARGS

      - name: Commit and push stats
        working-directory: data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ranked
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "ranked stats $(date -u +%Y-%m-%dT%H:%MZ)"
          # the crawler pushes to this branch too; stats and shards never touch the same files, so a rebase is safe
          for i in 1 2 3 4 5; do
            git push origin HEAD:ranked-data && exit 0
            git pull --rebase origin ranked-data
            sleep $((i * 5))
          done
          echo "push failed" >&2; exit 1
