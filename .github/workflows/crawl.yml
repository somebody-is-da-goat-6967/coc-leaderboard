name: crawl-legend-board
on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '50 4 * * *'   # extra run just before the 05:00 UTC Legend reset
  workflow_dispatch:
    inputs:
      mode:
        description: auto | refresh | discover | restart-dictionary
        default: auto
concurrency:
  group: crawl
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Restore previous data (orphan 'data' branch)
        run: |
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch data "$URL" data-out || { mkdir data-out; git -C data-out init -q -b data; git -C data-out remote add origin "$URL"; }
      - name: Crawl
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
          MODE: refresh
        run: node scanner/crawl.mjs
      - name: Publish (single-commit branch so history never grows)
        working-directory: data-out
        run: |
          git config user.name "crawler"; git config user.email "crawler@users.noreply.github.com"
          git checkout --orphan fresh
          git add -A
          git commit -q -m "snapshot $(date -u +%FT%TZ)"
          git push -f origin fresh:data
