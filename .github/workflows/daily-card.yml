name: Daily recap image

# Draws the Legend Day recap image (daily.html -> PNG) once the crawler has archived the finished day. Only finished days are drawn here;
# the day in progress is drawn in the visitor's browser by daily.html.
# The image lands on its own branch, `daily-cards`, so it never collides with the crawler's pushes to `data`:
#   https://raw.githubusercontent.com/<owner>/<repo>/daily-cards/latest.png     (always the newest day)
#   https://raw.githubusercontent.com/<owner>/<repo>/daily-cards/2026-10-29.png (by archive date = the day the Legend Day ended)
#   ...same names with .json: the facts of the day, handy for a Discord caption.
on:
  schedule:
    - cron: '20 5 * * *'        # 3 tries a day, to save Actions minutes: a try exits in seconds when there is nothing to do
    - cron: '50 5 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      date:  { description: 'Archive date YYYY-MM-DD (the day the Legend Day ended). Empty = newest', required: false }
      force: { description: 'Draw again even if the image exists', type: boolean, default: false }
  # Cheapest option (one run a day, exactly when the crawler is done): delete the 3 cron lines above and use this with your crawler workflow's name:
  # workflow_run: { workflows: ['<crawler workflow name>'], types: [completed] }

permissions:
  contents: write
concurrency:
  group: daily-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4                 # the website files (default branch)
      - uses: actions/checkout@v4                 # the crawler's data
        with: { ref: data, path: _data }
      - name: Fetch existing images (branch may not exist yet)
        run: git clone --depth 1 --branch daily-cards "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _cards 2>/dev/null || mkdir -p _cards
      - name: Is there a finished day without an image?
        id: decide
        env: { DATE: '${{ inputs.date }}', FORCE: '${{ inputs.force }}' }
        run: python3 scripts/render_daycard.py --decide
      - uses: actions/setup-python@v5
        if: steps.decide.outputs.todo == 'true'
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        if: steps.decide.outputs.todo == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - name: Install headless Chromium
        if: steps.decide.outputs.todo == 'true'
        run: pip install playwright && playwright install --with-deps chromium
      - name: Draw the image
        if: steps.decide.outputs.todo == 'true'
        env: { FORCE: '${{ inputs.force }}' }
        run: python3 scripts/render_daycard.py --date "${{ steps.decide.outputs.date }}"
      - name: Publish to the daily-cards branch (single commit, last 45 days kept)
        if: steps.decide.outputs.todo == 'true'
        working-directory: _cards
        env: { DATE: '${{ steps.decide.outputs.date }}' }
        run: |
          ls 20*.png 2>/dev/null | sort | head -n -45 | while read -r f; do rm -f "$f" "${f%.png}.json"; done
          printf '# Daily Legend Day recaps\n\nGenerated by `.github/workflows/daily-card.yml`. `latest.png` is the newest day.\n' > README.md
          rm -rf .git && git init -q -b daily-cards
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -qm "Legend Day recap $DATE"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin daily-cards
