name: sync-site-sources
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-site-sources
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: crawler
      - uses: actions/checkout@v4
        with:
          repository: somebody-is-da-goat-6967/website
          ref: main
          path: website-source
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync the website decoder and stats code
        run: node crawler/scripts/sync-site-sources.mjs website-source crawler
      - name: Publish source updates
        working-directory: crawler
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add armyids.js army.js legend.js stats.js scanner/armyids.js scanner/army.js scanner/stats.js site-compute/armyids.js site-compute/army.js site-compute/legend.js site-compute/stats.js site-compute/season.js site-compute/townhall.js
          if git diff --cached --quiet; then echo "website decoder and stats sources are current"; exit 0; fi
          git commit -m "sync website army decoder and stats"
          git push origin HEAD:main
